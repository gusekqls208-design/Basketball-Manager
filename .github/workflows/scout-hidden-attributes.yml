name: Scout all NBA player hidden attributes

on:
  push:
    branches: [main]
    paths:
      - "scripts/scout-hidden-attributes.mjs"
      - ".github/workflows/scout-hidden-attributes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-hidden-attribute-scouting
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch ESPN career records and precompute all hidden attributes
        run: node scripts/scout-hidden-attributes.mjs
      - name: Commit full-roster scouting data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hidden-scouting-2026-27.json
          if git diff --cached --quiet; then
            echo "No scouting changes."
          else
            git commit -m "Precompute career-based hidden attributes for all NBA players"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
