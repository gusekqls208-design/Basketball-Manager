name: Test NBA career stats endpoint
on:
  push:
    branches: [main]
    paths:
      - "scripts/test-nba-career-api.mjs"
      - ".github/workflows/test-nba-career-api.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/test-nba-career-api.mjs
