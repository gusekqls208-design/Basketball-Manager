function espnPosition(a,fallback="SF"){
 let candidates=[a?.position?.abbreviation,a?.position?.displayName,a?.position?.name].filter(Boolean).map(x=>String(x).toUpperCase());
 for(const v of candidates){if(["PG","POINT GUARD"].includes(v))return"PG";if(["SG","SHOOTING GUARD"].includes(v))return"SG";if(["SF","SMALL FORWARD"].includes(v))return"SF";if(["PF","POWER FORWARD"].includes(v))return"PF";if(["C","CENTER"].includes(v))return"C";}

    else p.ratingsSource="individual scouting estimate";

     p.birthDate=a.dateOfBirth||"";p.experience=Number(a.experience?.years||0);
