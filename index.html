<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131b"><title>WOLVERINE: LAST STAND</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#f4f4f5;font-family:system-ui,sans-serif;touch-action:none}body{display:grid;place-items:center}#shell{width:min(100vw,177.78vh);height:min(100vh,56.25vw);display:flex;flex-direction:column;background:#10131b;border:1px solid #303744}header,footer{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#121722;border-bottom:1px solid #29313e}header{height:48px}footer{height:22px;border:0;border-top:1px solid #29313e;color:#778396;font-size:9px;letter-spacing:2px}.brand{font-weight:900;letter-spacing:3px}.brand small{display:block;color:#9aa6b8;font-size:8px;letter-spacing:4px}.stats{font-size:10px;letter-spacing:2px;color:#9aa6b8}.stats b{color:white;font-size:14px;margin-left:5px}main{position:relative;flex:1;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block}.hud{position:absolute;left:16px;top:14px;display:flex;gap:14px;pointer-events:none}.bar{display:flex;align-items:center;gap:7px;font-size:9px;color:#c2cad5;letter-spacing:1px}.bar div{width:125px;height:7px;background:#29313e}.bar i{display:block;height:100%;background:#d64b48}.bar.r i{background:#e9b74f}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#090d16bb}.overlay.hide{display:none}.panel{text-align:center;padding:28px 36px;background:#111722ed;border:1px solid #455064;max-width:90%}.eyebrow{font-size:9px;letter-spacing:3px;color:#e9b74f}.panel h1{font-size:clamp(46px,8vw,84px);line-height:.8;font-style:italic;margin:18px 0}.panel em{color:#e9b74f}.panel p{color:#aab4c2;font-size:13px}button{cursor:pointer}#start{border:0;background:#e9b74f;color:#151820;font-weight:900;letter-spacing:2px;padding:14px 28px}.panel small{display:block;color:#8490a2;font-size:9px;line-height:1.8;margin-top:18px}.flash{position:absolute;top:23%;width:100%;text-align:center;font-size:32px;font-weight:1000;font-style:italic;letter-spacing:6px;color:#f5ca68;opacity:0;pointer-events:none}.flash.on{animation:flash 1.2s ease-out}@keyframes flash{15%,75%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}.touch{display:none;position:absolute;inset:auto 18px 18px;justify-content:space-between;align-items:end;pointer-events:none}.touch .move{display:flex;gap:14px}.touch .actions{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(2,64px);gap:10px;justify-items:center;align-items:center}.touch button{pointer-events:auto;border:2px solid #ffffff75;background:#111d;color:white;border-radius:18px;width:76px;height:64px;font-size:13px;font-weight:900;touch-action:none;box-shadow:0 4px 0 #0008;letter-spacing:.5px}.touch .move button{width:88px;height:88px;border-radius:22px;font-size:30px;background:#26354acc}.touch .atk{background:#9d382dcc}.touch .special{background:#7b512dcc}.touch .ult{background:#a47a24dd;border-color:#e9b74f}.touch .dash{background:#24566dcc}.touch .jump{background:#315b45cc}#skillInfo{position:absolute;right:18px;bottom:166px;max-width:310px;padding:9px 12px;background:#0b111ddd;border:1px solid #687487;color:#e6edf6;font-size:11px;line-height:1.35;letter-spacing:.2px;pointer-events:none;opacity:0;transition:opacity .15s}#skillInfo.show{opacity:1}@media(pointer:coarse),(max-width:900px){.touch{display:flex}.bar div{width:82px}header{height:40px;padding:0 12px}.hud{top:8px;left:10px}.touch .actions{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:7px}.touch button{width:64px;height:58px;font-size:11px}.touch .move button{width:76px;height:76px;font-size:28px}#skillInfo{right:14px;bottom:150px;max-width:250px}}
</style></head><body><div id="shell"><header><div class="brand">/// WOLVERINE<small>LAST STAND</small></div><div class="stats">WAVE <b id="wave">01</b>　 SCORE <b id="score">000000</b></div><button id="pause">Ⅱ</button></header><main><canvas id="c" width="1280" height="720"></canvas><div class="hud"><div class="bar">HP <div><i id="hp" style="width:100%"></i></div><b id="hpv">100</b></div><div class="bar r">RAGE <div><i id="rg" style="width:0%"></i></div><b id="rgv">0%</b></div></div><div id="flash" class="flash"></div><div id="overlay" class="overlay"><div class="panel"><div class="eyebrow">THE CITY WON'T SURVIVE THE NIGHT</div><h1>LAST<br><em>STAND</em></h1><p>Endless waves. No backup. Just adamantium.</p><button id="start">ENTER THE FIGHT</button><small>MOVE A/D · JUMP SPACE · DASH SHIFT<br>CLAWS J · BERSERKER K · RAGE L</small></div></div><div id="skillInfo"></div><div class="touch"><div class="move"><button data-k="left" aria-label="왼쪽 이동">◀</button><button data-k="right" aria-label="오른쪽 이동">▶</button></div><div class="actions"><button data-k="jump" class="jump" title="점프: 적의 공격을 뛰어넘고 공중에서 위치를 바꿉니다.">JUMP</button><button data-k="dash" class="dash" title="대시: 짧은 순간 빠르게 돌진하며 피해를 피합니다.">DASH</button><button data-k="attack" class="atk" title="클로 난무: 전방의 적을 아다만티움 발톱으로 베어 피해를 줍니다.">CLAW</button><button data-k="special" class="special" title="버서커 퓨리: 넓은 전방을 강하게 휩쓸어 큰 피해를 줍니다.">FURY</button><button data-k="ultimate" class="ult" title="레이지 브레이크: 분노 100%를 소모해 주변 적들을 초토화합니다.">RAGE</button></div></div></main><footer><span>WOLVERINE // SURVIVAL PROTOCOL</span><span id="status">READY</span></footer></div>
<script>
(()=>{const c=document.querySelector("#c"),x=c.getContext("2d"),W=1280,H=720,G=584,$=id=>document.getElementById(id);const files={idle:"WOLVERINE_IDLE.webp",run:"WOLVERINE_RUN.webp",jump:"WOLVERINE_JUMP.webp",dash:"WOLVERINE_DASH.webp",attack:"WOLVERINE_BASIC_ATTACK.webp",special:"WOLVERINE_SPECIAL_SKILL.webp",heavy:"WOLVERINE_HEAVY_SKILL.webp"},n={idle:8,run:8,jump:8,dash:6,attack:12,special:12,heavy:10},cols={idle:4,run:4,jump:4,dash:3,attack:4,special:4,heavy:5},im={};for(let k in files){im[k]=new Image();im[k].src="assets/"+files[k]}let p,foes=[],fx=[],keys={},mode="menu",pause=false,score=0,wave=1,rage=0,spawn=1,wtime=0,shake=0,cd={attack:0,special:0,ultimate:0,dash:0},clock=0,last=0;
const rnd=(a,b)=>a+Math.random()*(b-a);function reset(){p={x:260,y:G-136,vx:0,vy:0,hp:100,face:1,anim:"idle",frame:0,ground:true,inv:0,act:"",at:0,dash:0};foes=[];fx=[];score=0;wave=1;rage=0;spawn=1;wtime=0;cd={attack:0,special:0,ultimate:0,dash:0};hud()}
function hud(){$("hp").style.width=p.hp+"%";$("hpv").textContent=Math.ceil(p.hp);$("rg").style.width=rage+"%";$("rgv").textContent=Math.floor(rage)+"%";$("wave").textContent=String(wave).padStart(2,"0");$("score").textContent=String(score).padStart(6,"0")}
function flash(t){$("flash").textContent=t;$("flash").classList.remove("on");void $("flash").offsetWidth;$("flash").classList.add("on")}
function particles(a,b,color,count=12){for(let i=0;i<count;i++)fx.push({x:a,y:b,vx:rnd(-240,240),vy:rnd(-280,80),life:rnd(.2,.55),max:.55,color,size:rnd(2,7)})}
function spawnEnemy(){let elite=wave%4===0&&Math.random()<.25;foes.push({x:Math.random()<.5?0:W,y:G-70,hp:elite?100:40,max:elite?100:40,speed:elite?65:rnd(75,110),elite,hit:0,atk:0})}
function hit(range,dmg){let landed=0;for(let e of foes){if(Math.abs(e.x-p.x)<range&&Math.sign(e.x-p.x||1)===p.face){landed++;e.hp-=dmg;e.hit=.18;e.x+=p.face*25;particles(e.x,e.y-35,"#e9c36a",9);if(e.hp<=0){score+=e.elite?250:100;rage=Math.min(100,rage+(e.elite?18:9));e.dead=true;particles(e.x,e.y-30,"#b9d5e9",18)}}if(landed)p.hp=Math.min(100,p.hp+Math.min(4,landed*1.5));}}
function act(k){if(mode!=="play"||pause)return;const descriptions={attack:"CLAW COMBO · 전방의 적을 발톱으로 연속 베기. 적중 시 체력을 조금 회복합니다.",special:"BERSERKER FURY · 몸을 회전하며 전방 넓은 범위를 강타합니다. 높은 피해와 강한 타격 이펙트.",ultimate:"RAGE BREAK · 분노 100% 필요. 주변 넓은 범위의 적을 초토화하는 필살기.",dash:"ADAMANTIUM DASH · 빠르게 돌진하며 짧은 시간 적의 공격을 회피합니다."};if(descriptions[k]){const box=$("skillInfo");box.textContent=descriptions[k];box.classList.add("show");}if(k==="attack"&&cd.attack<=0){p.act="attack";p.at=.4;cd.attack=.48;hit(175,24);particles(p.x+p.face*80,p.y-75,"#dce8f2",5)}if(k==="special"&&cd.special<=0){p.act="special";p.at=.72;cd.special=3.2;shake=8;hit(255,48);for(let i=0;i<25;i++)particles(p.x+p.face*rnd(50,210),p.y-rnd(25,155),"#f2b84e",1)}if(k==="ultimate"&&rage>=100&&cd.ultimate<=0){rage=0;p.act="heavy";p.at=1.1;cd.ultimate=2;shake=18;for(let e of foes){if(Math.abs(e.x-p.x)<520){e.hp-=125;particles(e.x,e.y-30,"#f6d27a",25);if(e.hp<=0){e.dead=true;score+=e.elite?250:100}}}for(let i=0;i<75;i++)particles(p.x+rnd(-420,420),G-rnd(10,230),"#eab84d",1)}if(k==="dash"&&cd.dash<=0){p.dash=.22;p.inv=.28;p.vx=p.face*900;cd.dash=.8;p.act="dash";p.at=.22;particles(p.x,p.y-60,"#b7d6ef",8)}}
function update(dt){if(mode!=="play"||pause)return;clock+=dt;p.hp=Math.min(100,p.hp+dt*0.65);for(let k in cd)cd[k]=Math.max(0,cd[k]-dt);p.inv=Math.max(0,p.inv-dt);p.at=Math.max(0,p.at-dt);if(!p.at)p.act="";let l=keys.left||keys.a||keys.ArrowLeft,r=keys.right||keys.d||keys.ArrowRight;if(p.dash>0){p.dash-=dt;p.x+=p.vx*dt}else{p.vx=0;if(l){p.vx=-260;p.face=-1}if(r){p.vx=260;p.face=1}p.x+=p.vx*dt}if((keys.jump||keys.Space||keys.ArrowUp)&&p.ground){p.vy=-620;p.ground=false;keys.jump=keys.Space=keys.ArrowUp=false}p.vy+=1500*dt;p.y+=p.vy*dt;if(p.y>=G-136){p.y=G-136;p.vy=0;p.ground=true}p.x=Math.max(65,Math.min(W-65,p.x));p.anim=p.act||(!p.ground?"jump":Math.abs(p.vx)>5?"run":"idle");p.frame=(p.frame+dt*(p.anim==="run"?13:p.anim==="idle"?7:20))%n[p.anim];spawn-=dt;if(spawn<=0&&foes.length<14){spawnEnemy();spawn=Math.max(.42,1.6-wave*.055)}wtime+=dt;if(wtime>26){wave++;wtime=0;spawn=.2;flash("WAVE "+String(wave).padStart(2,"0"))}for(let e of foes){if(e.dead)continue;e.hit=Math.max(0,e.hit-dt);let dx=p.x-e.x;e.x+=Math.sign(dx)*e.speed*dt;if(Math.abs(dx)<62&&e.atk<=0){e.atk=.9;if(p.inv<=0){p.hp-=e.elite?13:8;p.inv=.55;shake=7;particles(p.x,p.y-55,"#d94e48",10)}}e.atk=Math.max(0,e.atk-dt)}foes=foes.filter(e=>!e.dead);for(let f of fx){f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=650*dt}fx=fx.filter(f=>f.life>0);shake=Math.max(0,shake-dt*25);if(p.hp<=0){p.hp=0;mode="over";$("overlay").classList.remove("hide");$("overlay").querySelector(".eyebrow").textContent="THE CITY HAS FALLEN";$("overlay").querySelector("h1").innerHTML="GAME<br><em>OVER</em>";$("overlay").querySelector("p").textContent="Score "+score+" · Wave "+wave;$("start").textContent="FIGHT AGAIN"}hud()}
function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#111b2a");g.addColorStop(.65,"#27364a");g.addColorStop(1,"#111720");x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle="#d7d9d0";x.globalAlpha=.18;x.beginPath();x.arc(1030,130,58,0,7);x.fill();x.globalAlpha=1;for(let i=0;i<18;i++){let xx=i*82-20,h=170+((Math.sin(i*91.7)*43758.5)%1+1)*80;x.fillStyle=i%2?"#1b2737":"#202d40";x.fillRect(xx,G-h,64,h);x.fillStyle="#d4ad61";for(let y=G-h+18;y<G-25;y+=28)for(let q=xx+12;q<xx+58;q+=22)if((i*q+y)%3>1)x.fillRect(q,y,5,8)}x.fillStyle="#141a22";x.fillRect(0,G,W,H-G);x.fillStyle="#48515d";x.fillRect(0,G,W,3);x.fillStyle="#242c38";for(let xx=0;xx<W;xx+=120)x.fillRect(xx,G+65,55,3)}
function sprite(k,xx,yy,fr,flip=false){let a=im[k];if(!a.complete||!a.naturalWidth)return;let id=Math.floor(fr)%n[k],col=cols[k],sx=4+(id%col)*164,sy=4+Math.floor(id/col)*164;x.save();x.translate(xx,yy);if(flip)x.scale(-1,1);x.imageSmoothingEnabled=false;x.drawImage(a,sx,sy,160,160,-100,-128,200,200);x.restore()}
function draw(){x.save();if(shake)x.translate(rnd(-shake,shake),rnd(-shake,shake));bg();for(let e of foes){x.save();x.translate(e.x,e.y);x.fillStyle=e.elite?"#8b3b38":"#353c49";x.fillRect(-24,-70,48,70);x.fillStyle=e.elite?"#d9a84b":"#9aa5b4";x.fillRect(-18,-62,36,15);x.fillStyle="#d94e48";x.fillRect(-13,-48,7,4);x.fillRect(6,-48,7,4);x.fillStyle="#111";x.fillRect(-22,-4,16,8);x.fillRect(7,-4,16,8);x.restore();if(e.elite){x.fillStyle="#171b23";x.fillRect(e.x-30,e.y-92,60,5);x.fillStyle="#d94e48";x.fillRect(e.x-30,e.y-92,60*e.hp/e.max,5)}}if(p){if(p.inv&&Math.floor(clock*22)%2===0)x.globalAlpha=.45;sprite(p.anim,p.x,p.y,p.frame,p.face<0);x.globalAlpha=1}for(let f of fx){x.globalAlpha=Math.max(0,f.life/f.max);x.fillStyle=f.color;x.fillRect(f.x,f.y,f.size,f.size)}x.globalAlpha=1;x.restore()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function start(){reset();mode="play";$("overlay").classList.add("hide");flash("WAVE 01")}
function toggle(){if(mode==="play"){pause=!pause;$("status").textContent=pause?"PAUSED":"IN COMBAT"}}
window.addEventListener("keydown",e=>{let k=e.key;if([" ","ArrowUp","ArrowLeft","ArrowRight"].includes(k))e.preventDefault();keys[k]=true;if(k.toLowerCase()==="j")act("attack");if(k.toLowerCase()==="k")act("special");if(k.toLowerCase()==="l")act("ultimate");if(k==="Shift")act("dash");if(k==="Escape")toggle()});window.addEventListener("keyup",e=>keys[e.key]=false);$("start").onclick=start;$("pause").onclick=toggle;document.querySelectorAll("[data-k]").forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();if(["attack","special","ultimate","dash"].includes(k))act(k);else keys[k]=true};for(let ev of ["pointerup","pointercancel","pointerleave"])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false})});reset();requestAnimationFrame(loop)})();
</script></body></html>
