<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090e17"><title>BASKETBALL MANAGER</title>
<style>
:root{--bg:#080d15;--panel:#111a27;--panel2:#172333;--line:#29394d;--muted:#91a2b8;--text:#eef4fb;--ice:#8bd5f5;--green:#8ad4b0;--red:#ed8585;--gold:#e5c27d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none}body{overflow:hidden}button,select,input{font:inherit}button{cursor:pointer;color:inherit}#app{height:100dvh;display:flex;flex-direction:column;max-width:1600px;margin:auto;background:radial-gradient(ellipse at 80% -20%,#1b3245 0,transparent 40%),var(--bg)}header{height:66px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0b121ddf}.brand{font-weight:950;letter-spacing:3px;font-size:16px}.brand span{color:var(--ice)}.season-tag{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:4px}.headright{display:flex;gap:18px;align-items:center;font-size:12px;color:var(--muted)}.headright b{color:var(--text);font-size:14px}.layout{display:flex;min-height:0;flex:1}.side{width:210px;flex:none;border-right:1px solid var(--line);padding:20px 12px;background:#0c131e}.navlabel{font-size:9px;color:#64768c;letter-spacing:2px;padding:12px 12px 7px}.nav{width:100%;border:0;background:none;text-align:left;padding:12px;border-radius:8px;color:#9eafc3;font-size:13px;display:flex;gap:11px;align-items:center;margin:2px 0}.nav.active,.nav:hover{background:#1b2a3b;color:#fff}.nav.active{box-shadow:inset 2px 0 var(--ice)}.nav .ico{width:18px;text-align:center;color:var(--ice)}main{min-width:0;flex:1;overflow:auto;padding:26px 30px 50px}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.eyebrow{font-size:9px;letter-spacing:2px;color:var(--ice);font-weight:800}.pagehead h1{font-size:25px;letter-spacing:-.7px;margin:6px 0 0}.muted{color:var(--muted)}.small{font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:linear-gradient(145deg,#142131,#101925);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.card h3{margin:0 0 13px;font-size:12px;letter-spacing:.5px}.metric{font-size:27px;font-weight:850;letter-spacing:-1px}.metric-sub{font-size:10px;color:var(--muted);margin-top:5px}.section{margin-top:16px}.sectionbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.sectionbar h2{font-size:13px;margin:0;letter-spacing:.5px}.btn{background:#203449;border:1px solid #38536c;padding:9px 13px;border-radius:7px;font-size:11px;font-weight:750}.btn.primary{background:#b5e8fa;color:#10202b;border-color:#b5e8fa}.btn.ghost{background:transparent;border-color:var(--line);color:#b6c5d7}.btn.danger{border-color:#70454b;color:#f0a0a0;background:#2b1b21}.btn:disabled{opacity:.4;cursor:not-allowed}.teamgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.teamtile{background:#111c2a;border:1px solid var(--line);border-radius:9px;padding:12px;text-align:left;min-height:76px}.teamtile:hover,.teamtile.selected{border-color:var(--ice);background:#1a2b3d}.teamtile b{display:block;font-size:12px}.teamtile small{color:var(--muted);font-size:9px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}th{text-align:left;color:#8fa2b8;font-weight:650;background:#121e2c;padding:11px 12px;position:sticky;top:0}td{padding:10px 12px;border-top:1px solid #243346}tr:hover td{background:#172536}.rating{font-weight:850;color:var(--ice)}.pill{font-size:9px;padding:4px 7px;border-radius:20px;background:#24364a;color:#b8cce0}.pill.good{color:var(--green);background:#173329}.pill.warn{color:var(--gold);background:#382e1b}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:#111b28;color:#9eafc3;font-size:10px}.tab.active{border-color:var(--ice);color:var(--ice);background:#1a2d3e}.matchbox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:24px;background:linear-gradient(120deg,#182b3d,#111a26);border:1px solid #39536b;border-radius:12px;text-align:center}.matchbox .club{font-size:19px;font-weight:900}.score{font-size:34px;font-weight:900;letter-spacing:2px}.log{height:280px;overflow:auto;background:#0b121c;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:11px;line-height:1.8}.log p{margin:0;border-bottom:1px solid #1c2a3b;padding:3px 0}.formrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,input{background:#0c1520;border:1px solid #35475d;color:var(--text);border-radius:6px;padding:9px;font-size:11px}.empty{padding:35px;text-align:center;color:var(--muted);font-size:12px}.notice{border:1px solid #675538;background:#2b2519;color:#e8d5a7;padding:11px 13px;border-radius:8px;font-size:10px;line-height:1.6;margin-bottom:15px}.hidden{display:none!important}.setup{max-width:1100px;margin:0 auto}.setupintro{padding:28px 0}.setupintro h1{font-size:34px;letter-spacing:-1.5px;margin:9px 0}.setupintro p{font-size:12px;color:var(--muted);max-width:620px;line-height:1.7}.mobilebar{display:none}.playerdetail{display:grid;grid-template-columns:260px 1fr;gap:14px}.attrgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.attr{background:#0e1824;padding:9px;border-radius:6px}.attr span{display:block;font-size:9px;color:var(--muted)}.attr b{font-size:15px}.progress{height:5px;background:#27384b;border-radius:5px;margin-top:6px;overflow:hidden}.progress i{display:block;height:100%;background:var(--ice)}@media(max-width:850px){header{height:55px;padding:0 14px}.headright{gap:8px;font-size:10px}.side{width:62px;padding:10px 6px}.nav{justify-content:center;padding:13px 4px;font-size:0}.nav .ico{font-size:16px}.navlabel{display:none}main{padding:18px 13px 35px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.teamgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.pagehead h1{font-size:21px}.playerdetail{grid-template-columns:1fr}.attrgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.teamgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.matchbox{gap:7px;padding:15px}.matchbox .club{font-size:13px}.score{font-size:25px}.grid{gap:8px}.card{padding:12px}.metric{font-size:22px}}
</style></head><body><div id="app"><header><div><div class="brand">BASKETBALL <span>MANAGER</span></div><div class="season-tag">FRONT OFFICE SIMULATION · 2026/27</div></div><div class="headright"><span id="teamhead">팀 미선택</span><span>예산 <b id="moneyhead">₩0</b></span></div></header><div class="layout"><aside class="side" id="sidebar"><div class="navlabel">FRONT OFFICE</div><button class="nav active" data-page="home"><span class="ico">▦</span>대시보드</button><button class="nav" data-page="roster"><span class="ico">♟</span>선수단</button><button class="nav" data-page="schedule"><span class="ico">▤</span>일정 / 결과</button><button class="nav" data-page="standings"><span class="ico">▥</span>리그 순위</button><div class="navlabel">STRATEGY</div><button class="nav" data-page="tactics"><span class="ico">⌘</span>전술 센터</button><button class="nav" data-page="market"><span class="ico">⇄</span>선수 시장</button><button class="nav" data-page="office"><span class="ico">⚙</span>구단 운영</button><div class="navlabel">CAREER</div><button class="nav" data-page="save"><span class="ico">▣</span>저장 / 백업</button></aside><main id="main"></main></div></div>
<script>
const teams=[
["BOS","Boston Celtics","동부","Atlantic"],["BKN","Brooklyn Nets","동부","Atlantic"],["NYK","New York Knicks","동부","Atlantic"],["PHI","Philadelphia 76ers","동부","Atlantic"],["TOR","Toronto Raptors","동부","Atlantic"],
["CHI","Chicago Bulls","동부","Central"],["CLE","Cleveland Cavaliers","동부","Central"],["DET","Detroit Pistons","동부","Central"],["IND","Indiana Pacers","동부","Central"],["MIL","Milwaukee Bucks","동부","Central"],
["ATL","Atlanta Hawks","동부","Southeast"],["CHA","Charlotte Hornets","동부","Southeast"],["MIA","Miami Heat","동부","Southeast"],["ORL","Orlando Magic","동부","Southeast"],["WAS","Washington Wizards","동부","Southeast"],
["DEN","Denver Nuggets","서부","Northwest"],["MIN","Minnesota Timberwolves","서부","Northwest"],["OKC","Oklahoma City Thunder","서부","Northwest"],["POR","Portland Trail Blazers","서부","Northwest"],["UTA","Utah Jazz","서부","Northwest"],
["GSW","Golden State Warriors","서부","Pacific"],["LAC","LA Clippers","서부","Pacific"],["LAL","Los Angeles Lakers","서부","Pacific"],["PHX","Phoenix Suns","서부","Pacific"],["SAC","Sacramento Kings","서부","Pacific"],
["DAL","Dallas Mavericks","서부","Southwest"],["HOU","Houston Rockets","서부","Southwest"],["MEM","Memphis Grizzlies","서부","Southwest"],["NOP","New Orleans Pelicans","서부","Southwest"],["SAS","San Antonio Spurs","서부","Southwest"]];
const stars={BOS:"Jayson Tatum",BKN:"Michael Porter Jr.",NYK:"Jalen Brunson",PHI:"Joel Embiid",TOR:"Scottie Barnes",CHI:"Josh Giddey",CLE:"Donovan Mitchell",DET:"Cade Cunningham",IND:"Pascal Siakam",MIL:"Giannis Antetokounmpo",ATL:"Dyson Daniels",CHA:"LaMelo Ball",MIA:"Giannis Antetokounmpo",ORL:"Franz Wagner",WAS:"Alex Sarr",DEN:"Nikola Jokić",MIN:"Rudy Gobert",OKC:"Shai Gilgeous-Alexander",POR:"Deni Avdija",UTA:"Lauri Markkanen",GSW:"Stephen Curry",LAC:"Kawhi Leonard",LAL:"Luka Dončić",PHX:"Devin Booker",SAC:"Domantas Sabonis",DAL:"Kyrie Irving",HOU:"Alperen Sengun",MEM:"Ja Morant",NOP:"Zion Williamson",SAS:"Victor Wembanyama"};
const pos=["PG","SG","SF","PF","C"],first=["Alex","Jordan","Marcus","Darius","Tyler","Cameron","Jalen","Malik","Devin","Aaron","Isaiah","Noah","Elijah","Dylan","Caleb","Brandon","Tre","Jaylen","Donovan","Riley"],last=["Carter","Brooks","Hayes","Mitchell","Reed","Foster","Bennett","Coleman","Parker","Turner","Wright","Morris","Jackson","Davis","Young","Howard","Price","Ward","Simmons","Ross"];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rnd(0,a.length-1)], money=n=>"₩"+Math.round(n).toLocaleString("ko-KR")+"억";
let state=load();
function load(){try{return JSON.parse(localStorage.getItem("bm_save_v1"))}catch(e){return null}}
function persist(){localStorage.setItem("bm_save_v1",JSON.stringify(state))}
function makePlayer(name,p,i,base){let o=base||rnd(8,15);let a={close:rnd(o-3,o+2),layup:rnd(o-2,o+2),dunk:rnd(o-4,o+3),mid:rnd(o-3,o+2),three:rnd(o-3,o+2),ft:rnd(o-2,o+3),post:rnd(o-5,o+2),handle:rnd(o-3,o+3),pass:rnd(o-3,o+3),vision:rnd(o-3,o+3),perimeter:rnd(o-3,o+3),interior:rnd(o-4,o+2),steal:rnd(o-3,o+3),block:rnd(o-5,o+3),rebound:rnd(o-4,o+3),stamina:rnd(o-2,o+3),speed:rnd(o-2,o+3),strength:rnd(o-4,o+3),decisions:rnd(o-2,o+3),teamwork:rnd(o-2,o+3),composure:rnd(o-2,o+3)};let weights=p==="PG"?["handle","pass","vision","speed","three"]:p==="C"?["interior","rebound","block","strength","close"]:p==="PF"?["rebound","strength","interior","post","dunk"]:p==="SG"?["three","handle","perimeter","mid","speed"]:["mid","perimeter","rebound","three","layup"];let ovr=Math.round(weights.reduce((s,k)=>s+a[k],0)/weights.length);return{id:crypto.randomUUID(),name,pos:p,age:rnd(20,34),height:p==="C"?rnd(208,220):p==="PF"?rnd(200,211):p==="SF"?rnd(195,205):rnd(183,198),weight:p==="C"?rnd(108,125):rnd(82,105),ovr,attrs:a,salary:rnd(35,320),years:rnd(1,4),condition:rnd(78,100),fatigue:rnd(0,18),role:i<5?"선발":"로테이션",pts:0,reb:0,ast:0,minutes:0,trait:pick(["캐치 앤 슛","픽앤롤 플레이메이커","림 프로텍터","트랜지션 피니셔","미드레인지 전문가","온볼 수비수","리바운드 사냥꾼"])}}
function createLeague(teamId){let clubs=teams.map((t,i)=>{let list=[];let star=stars[t[0]];for(let n=0;n<12;n++){let p=pos[n%5];let nm=n===0?star:pick(first)+" "+pick(last);let base=n===0?17:rnd(8,14);list.push(makePlayer(nm,p,n,base))}return{id:t[0],name:t[1],conf:t[2],division:t[3],players:list,w:0,l:0,pf:0,pa:0,money:2500,coach:"수석 코치",tactics:{off:"균형",def:"맨투맨",tempo:"보통",boards:"균형"}}});let schedule=[];for(let r=0;r<50;r++){let order=[...clubs].sort(()=>Math.random()-.5);for(let i=0;i<15;i++){let home=order[i],away=order[29-i];schedule.push({id:schedule.length,round:r+1,home:home.id,away:away.id,played:false,hs:null,as:null,logs:[]})}}return{version:1,teamId,clubs,schedule,round:1,gameCount:0,season:"2026/27",cash:2500,log:[],tactics:{off:"균형",def:"맨투맨",tempo:"보통",boards:"균형",players:{}},created:new Date().toISOString()}}
function my(){return state?.clubs.find(t=>t.id===state.teamId)}
function club(id){return state.clubs.find(t=>t.id===id)}
function teamName(id){return club(id)?.name||id}
function fmt(n){return Math.round(n).toLocaleString("ko-KR")}
function nav(page){document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render(page)}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>nav(b.dataset.page));
function render(page="home"){if(!state){renderSetup();return}document.getElementById("teamhead").textContent=my().name;document.getElementById("moneyhead").textContent=money(state.cash);let m=document.getElementById("main");({home:homePage,roster:rosterPage,schedule:schedulePage,standings:standingsPage,tactics:tacticsPage,market:marketPage,office:officePage,save:savePage}[page]||homePage)(m)}
function renderSetup(){document.getElementById("sidebar").classList.add("hidden");document.getElementById("teamhead").textContent="프랜차이즈 선택";document.getElementById("main").innerHTML='<div class="setup"><div class="setupintro"><div class="eyebrow">YOUR FRANCHISE. YOUR LEGACY.</div><h1>BUILD A DYNASTY.</h1><p>30개 NBA 프랜차이즈 중 한 팀을 선택해 단장 겸 감독으로 커리어를 시작하세요. 50경기 정규시즌, 플레이오프, 드래프트와 선수 시장이 기다립니다.</p><div class="notice">초기 플레이 가능한 빌드입니다. 구단 선택과 경기 엔진부터 구현했으며, 현재 선수단은 경기 시스템 검증용 샘플 데이터입니다. 실제 2026/27 개막 로스터 519명과 상세 능력치·계약 정보는 별도 검증 후 순차 반영합니다.</div></div><div class="sectionbar"><h2>SELECT YOUR FRANCHISE</h2><span class="small muted">30 TEAMS · 2 CONFERENCES</span></div><div class="teamgrid">'+teams.map(t=>'<button class="teamtile" onclick="startClub(\''+t[0]+'\')"><b>'+t[1]+'</b><small>'+t[2]+' · '+t[3]+'</small></button>').join("")+'</div></div>'}
function startClub(id){state=createLeague(id);persist();document.getElementById("sidebar").classList.remove("hidden");nav("home")}
function head(k,title,desc,action=""){return '<div class="pagehead"><div><div class="eyebrow">'+k+'</div><h1>'+title+'</h1><div class="small muted">'+desc+'</div></div>'+action+'</div>'}
function nextGame(){return state.schedule.find(g=>!g.played&&(g.home===state.teamId||g.away===state.teamId))}
function homePage(m){let t=my(),g=nextGame(),wins=t.w,loss=t.l,played=wins+loss;let roster=[...t.players].sort((a,b)=>b.ovr-a.ovr);m.innerHTML=head("FRONT OFFICE / OVERVIEW","구단 대시보드",state.season+" 시즌 · "+(state.round)+" 라운드 진행 중")+'<div class="grid"><div class="card"><h3>전적</h3><div class="metric">'+wins+' - '+loss+'</div><div class="metric-sub">승률 '+(played?(wins/played*100).toFixed(1):"0.0")+'% · '+played+'/50 경기</div></div><div class="card"><h3>팀 전력</h3><div class="metric">'+Math.round(roster.slice(0,8).reduce((s,p)=>s+p.ovr,0)/8)+'</div><div class="metric-sub">상위 8인 평균 OVR</div></div><div class="card"><h3>구단 예산</h3><div class="metric">'+money(state.cash)+'</div><div class="metric-sub">가용 예산 · 선수단 급여 별도</div></div><div class="card"><h3>리그 순위</h3><div class="metric">'+(standings().findIndex(x=>x.id===t.id)+1)+'위</div><div class="metric-sub">'+t.conf+' 컨퍼런스</div></div></div><div class="section"><div class="sectionbar"><h2>NEXT MATCH</h2><span class="pill">'+(g?"ROUND "+g.round:"시즌 종료")+'</span></div>'+(g?'<div class="matchbox"><div><div class="small muted">'+(g.home===t.id?"HOME":"AWAY")+'</div><div class="club">'+(g.home===t.id?t.name:teamName(g.home))+'</div></div><div><div class="score">VS</div><button class="btn primary" onclick="playNext()">경기 진행하기 →</button></div><div><div class="small muted">'+(g.away===t.id?"HOME":"AWAY")+'</div><div class="club">'+(g.away===t.id?t.name:teamName(g.away))+'</div></div></div>':'<div class="card empty">정규시즌 모든 경기를 마쳤습니다.</div>')+'</div><div class="section" style="display:grid;grid-template-columns:1.2fr 1fr;gap:12px"><div class="card"><div class="sectionbar"><h2>KEY PLAYERS</h2><button class="btn ghost" onclick="nav(\'roster\')">선수단 보기</button></div>'+roster.slice(0,5).map(p=>'<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #253448"><span><b>'+p.name+'</b> <span class="muted">'+p.pos+'</span></span><span class="rating">'+p.ovr+' OVR</span></div>').join("")+'</div><div class="card"><div class="sectionbar"><h2>COACH'S NOTE</h2><span class="pill">REPORT</span></div><p class="small muted" style="line-height:1.8">감독님, 선수단 컨디션과 전술 적합도를 확인하세요. 경기 중 우리 팀 교체는 자동으로 진행되지 않습니다. 교체가 필요하면 코치가 알림을 띄우고 최종 결정은 감독님이 내립니다.</p><button class="btn" onclick="nav(\'tactics\')">전술 센터 열기</button></div></div>'}
function rosterPage(m){let t=my();m.innerHTML=head("SQUAD MANAGEMENT","선수단","선수 능력치와 역할, 컨디션을 관리합니다.")+'<div class="notice">샘플 선수단 데이터입니다. 실제 개막 로스터·선수별 신체 정보·연봉·계약 기간은 공식 자료 검증 후 반영됩니다. 선수 이름과 능력치는 선수 편집 메뉴에서 직접 수정할 수 있습니다.</div><div class="sectionbar"><h2>FIRST TEAM · '+t.players.length+' PLAYERS</h2><button class="btn primary" onclick="addPlayer()">+ 선수 생성</button></div><div class="tablewrap"><table><thead><tr><th>선수</th><th>POS</th><th>AGE</th><th>HT</th><th>OVR</th><th>CON</th><th>ROLE</th><th>연봉</th><th></th></tr></thead><tbody>'+t.players.sort((a,b)=>b.ovr-a.ovr).map(p=>'<tr><td><b>'+p.name+'</b><div class="small muted">'+p.trait+'</div></td><td>'+p.pos+'</td><td>'+p.age+'</td><td>'+p.height+'cm</td><td class="rating">'+p.ovr+'</td><td>'+p.condition+'%</td><td>'+p.role+'</td><td>'+money(p.salary)+'</td><td><button class="btn ghost" onclick="editPlayer(\''+p.id+'\')">상세 / 수정</button></td></tr>').join("")+'</tbody></table></div>'}
function editPlayer(id){let p=my().players.find(x=>x.id===id);let attrs=[["close","골밑슛"],["layup","레이업"],["dunk","덩크"],["mid","미들슛"],["three","3점슛"],["ft","자유투"],["post","포스트"],["handle","볼 핸들링"],["pass","패스"],["vision","코트 시야"],["perimeter","외곽 수비"],["interior","골밑 수비"],["steal","스틸"],["block","블록"],["rebound","리바운드"],["stamina","체력"],["speed","속력"],["strength","근력"],["decisions","판단력"],["teamwork","팀워크"],["composure","침착성"]];let box=document.createElement("div");box.style.cssText="position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:15px";box.innerHTML='<div class="card" style="width:min(800px,100%);max-height:90dvh;overflow:auto"><div class="sectionbar"><div><div class="eyebrow">PLAYER PROFILE</div><h2>'+p.name+'</h2></div><button class="btn ghost" onclick="this.closest(\'div[style*=fixed]\').remove()">닫기</button></div><div class="formrow"><label>이름 <input id="pn" value="'+p.name+'"></label><label>포지션 <select id="pp">'+pos.map(x=>'<option '+(x===p.pos?'selected':'')+'>'+x+'</option>').join("")+'</select></label><label>나이 <input id="pa" type="number" value="'+p.age+'" style="width:65px"></label><label>역할 <select id="pr">'+["프랜차이즈 스타","핵심 선수","선발","로테이션","벤치","유망주","전력 외"].map(x=>'<option '+(p.role===x?'selected':'')+'>'+x+'</option>').join("")+'</select></label></div><div class="attrgrid" style="margin-top:14px">'+attrs.map(([k,n])=>'<label class="attr"><span>'+n+'</span><b>'+p.attrs[k]+'</b><input data-attr="'+k+'" type="range" min="0" max="20" value="'+p.attrs[k]+'" style="width:100%;padding:0"></label>').join("")+'</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button class="btn danger" onclick="removePlayer(\''+p.id+'\');this.closest(\'div[style*=fixed]\').remove()">방출</button><button class="btn primary" id="savep">변경 저장</button></div></div>';document.body.append(box);box.querySelector("#savep").onclick=()=>{p.name=box.querySelector("#pn").value;p.pos=box.querySelector("#pp").value;p.age=+box.querySelector("#pa").value;p.role=box.querySelector("#pr").value;box.querySelectorAll("[data-attr]").forEach(x=>p.attrs[x.dataset.attr]=+x.value);let keys=p.pos==="PG"?["handle","pass","vision","speed","three"]:p.pos==="C"?["interior","rebound","block","strength","close"]:["three","handle","perimeter","mid","rebound"];p.ovr=Math.round(keys.reduce((s,k)=>s+p.attrs[k],0)/keys.length);persist();box.remove();nav("roster")}}
function removePlayer(id){my().players=my().players.filter(p=>p.id!==id);persist();nav("roster")}
function addPlayer(){let name=prompt("선수 이름");if(!name)return;let p=makePlayer(name,"SF",my().players.length,11);my().players.push(p);persist();nav("roster")}
function schedulePage(m){let t=my();m.innerHTML=head("SEASON CALENDAR","일정 / 결과","총 50경기 · 경기 결과와 박스스코어를 확인합니다.")+'<div class="tablewrap"><table><thead><tr><th>ROUND</th><th>HOME</th><th>점수</th><th>AWAY</th><th>상태</th><th></th></tr></thead><tbody>'+state.schedule.filter(g=>g.home===t.id||g.away===t.id).map(g=>'<tr><td>'+g.round+'</td><td>'+teamName(g.home)+'</td><td class="rating">'+(g.played?g.hs+" - "+g.as:"—")+'</td><td>'+teamName(g.away)+'</td><td>'+(g.played?'<span class="pill good">종료</span>':'<span class="pill">예정</span>')+'</td><td>'+(g.played?'<button class="btn ghost" onclick="showGame('+g.id+')">기록</button>':g===nextGame()?'<button class="btn primary" onclick="playNext()">진행</button>':'')+'</td></tr>').join("")+'</tbody></table></div>'}
function standings(){return [...state.clubs].sort((a,b)=>b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa))}
function standingsPage(m){let arr=standings();m.innerHTML=head("LEAGUE TABLE","리그 순위","동부 / 서부 컨퍼런스 · 50경기 정규시즌")+'<div class="tabs"><button class="tab active" onclick="standTab(\'동부\',this)">동부 컨퍼런스</button><button class="tab" onclick="standTab(\'서부\',this)">서부 컨퍼런스</button></div><div id="standtable" class="section">'+standTable(arr.filter(t=>t.conf==="동부"))+'</div>'}
function standTab(c,b){document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("standtable").innerHTML=standTable(standings().filter(t=>t.conf===c))}
function standTable(arr){return '<div class="tablewrap"><table><thead><tr><th>#</th><th>TEAM</th><th>W</th><th>L</th><th>PCT</th><th>PF</th><th>PA</th></tr></thead><tbody>'+arr.map((t,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+t.name+'</b></td><td class="rating">'+t.w+'</td><td>'+t.l+'</td><td>'+((t.w/(t.w+t.l||1))*100).toFixed(1)+'%</td><td>'+t.pf+'</td><td>'+t.pa+'</td></tr>').join("")+'</tbody></table></div>'}
function tacticsPage(m){let t=my(),x=state.tactics;m.innerHTML=head("COACHING CENTER","전술 센터","팀 전술과 선수별 지시를 설정합니다.")+'<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card"><h3>팀 공격 전술</h3><select id="off" style="width:100%">'+["균형","픽앤롤 중심","3점슛 중심","속공","포스트업","아이솔레이션","모션 오펜스","컷인 중심"].map(v=>'<option '+(x.off===v?'selected':'')+'>'+v+'</option>').join("")+'</select><p class="small muted">선수단의 패스·핸들링·슈팅 능력과 전술 적합도가 경기 효율에 영향을 줍니다.</p></div><div class="card"><h3>팀 수비 전술</h3><select id="def" style="width:100%">'+["맨투맨","2-3 지역방어","3-2 지역방어","풀코트 프레스","하프코트 프레스","스위치","드롭 커버리지"].map(v=>'<option '+(x.def===v?'selected':'')+'>'+v+'</option>').join("")+'</select><p class="small muted">수비 전술은 상대 공격 유형과 선수들의 수비 능력에 따라 효과가 달라집니다.</p></div><div class="card"><h3>경기 템포</h3><select id="tempo" style="width:100%">'+["빠르게","보통","느리게"].map(v=>'<option '+(x.tempo===v?'selected':'')+'>'+v+'</option>').join("")+'</select></div><div class="card"><h3>리바운드 지시</h3><select id="boards" style="width:100%">'+["공격 리바운드 적극 가담","균형","수비 전환 우선"].map(v=>'<option '+(x.boards===v?'selected':'')+'>'+v+'</option>').join("")+'</select></div></div><div class="section"><div class="sectionbar"><h2>INDIVIDUAL INSTRUCTIONS</h2><span class="small muted">선수별 지시</span></div><div class="tablewrap"><table><thead><tr><th>선수</th><th>공격 지시</th><th>수비 지시</th></tr></thead><tbody>'+t.players.map(p=>'<tr><td><b>'+p.name+'</b> <span class="muted">'+p.pos+'</span></td><td><select data-player="'+p.id+'" data-kind="attack"><option>기본</option><option>더 많이 슛</option><option>3점 집중</option><option>림 어택</option><option>패스 우선</option><option>포스트업</option></select></td><td><select data-player="'+p.id+'" data-kind="defense"><option>기본</option><option>상대 에이스 전담</option><option>타이트 수비</option><option>스틸 적극 시도</option><option>파울 자제</option><option>리바운드 우선</option></select></td></tr>').join("")+'</tbody></table></div><button class="btn primary" style="margin-top:12px" onclick="saveTactics()">전술 저장</button></div>'}
function saveTactics(){state.tactics.off=document.getElementById("off").value;state.tactics.def=document.getElementById("def").value;state.tactics.tempo=document.getElementById("tempo").value;state.tactics.boards=document.getElementById("boards").value;persist();alert("전술이 저장됐습니다.");}
function marketPage(m){let free=state.clubs.flatMap(t=>t.players.filter(p=>p.role==="전력 외").map(p=>({...p,from:t.id})));m.innerHTML=head("PLAYER MARKET","선수 시장","트레이드·현금 이적·자유계약 시스템의 기반 화면입니다.")+'<div class="notice">현재 MVP에서는 선수단 편집과 선수 생성/방출이 동작합니다. AI 구단 간 트레이드, 연봉 매칭, 드래프트 픽, 현금 이적료 협상은 다음 구현 단계에서 연결됩니다.</div><div class="grid"><div class="card"><h3>선수 검색</h3><input id="searchp" placeholder="선수 이름 검색" style="width:100%" oninput="searchMarket()"></div><div class="card"><h3>포지션</h3><select id="filterpos" style="width:100%" onchange="searchMarket()"><option>전체</option>'+pos.map(p=>'<option>'+p+'</option>').join("")+'</select></div><div class="card"><h3>나이 범위</h3><div class="metric">18–40</div><div class="metric-sub">선수 데이터 필터 예정</div></div><div class="card"><h3>스카우팅</h3><div class="metric">기본망</div><div class="metric-sub">리포트 기능 예정</div></div></div><div id="marketlist" class="section"></div>';searchMarket()}
function searchMarket(){let q=document.getElementById("searchp")?.value.toLowerCase()||"",po=document.getElementById("filterpos")?.value||"전체";let all=state.clubs.flatMap(t=>t.players.map(p=>({...p,from:t.id}))).filter(p=>p.name.toLowerCase().includes(q)&&(po==="전체"||p.pos===po));document.getElementById("marketlist").innerHTML='<div class="tablewrap"><table><thead><tr><th>선수</th><th>소속</th><th>POS</th><th>AGE</th><th>OVR</th><th>연봉</th></tr></thead><tbody>'+all.slice(0,100).map(p=>'<tr><td>'+p.name+'</td><td>'+teamName(p.from)+'</td><td>'+p.pos+'</td><td>'+p.age+'</td><td class="rating">'+p.ovr+'</td><td>'+money(p.salary)+'</td></tr>').join("")+'</tbody></table></div>'}
function officePage(m){let t=my();m.innerHTML=head("CLUB OPERATIONS","구단 운영","구단 재정과 운영 현황을 확인합니다.")+'<div class="grid"><div class="card"><h3>현금 보유액</h3><div class="metric">'+money(state.cash)+'</div></div><div class="card"><h3>선수단 연봉 총액</h3><div class="metric">'+money(t.players.reduce((s,p)=>s+p.salary,0))+'</div></div><div class="card"><h3>팀 평판</h3><div class="metric">72</div></div><div class="card"><h3>팬 만족도</h3><div class="metric">80%</div></div></div><div class="section card"><h3>구단 목표</h3><p class="small muted">이번 시즌 목표: 플레이오프 진출</p><div class="progress"><i style="width:'+Math.min(100,t.w/30*100)+'%"></i></div><p class="small muted">'+t.w+'승 / 목표 30승</p></div><div class="section card"><h3>스태프</h3><p class="small muted">감독·코치·스카우트·의료진의 전문 능력치와 계약 관리는 확장 단계에서 구현됩니다.</p></div>'}
function savePage(m){m.innerHTML=head("CAREER DATA","저장 / 백업","브라우저에 자동 저장됩니다. 백업 파일로 다른 기기에서 이어할 수 있습니다.")+'<div class="card"><h3>현재 세이브</h3><p class="small muted">'+my().name+' · '+state.season+' · '+state.gameCount+'경기 진행</p><div class="formrow"><button class="btn primary" onclick="exportSave()">세이브 내보내기</button><label class="btn">세이브 불러오기<input type="file" accept="application/json" onchange="importSave(event)" hidden></label><button class="btn danger" onclick="if(confirm(\'현재 커리어를 삭제하고 새 팀을 선택할까요?\')){localStorage.removeItem(\'bm_save_v1\');state=null;render()}">커리어 초기화</button></div></div><div class="section card"><h3>저장 방식</h3><p class="small muted">자동 저장: 경기 종료, 선수 수정, 전술 변경 시 브라우저 localStorage에 저장됩니다. 브라우저 데이터 삭제 전 백업 파일을 내려받으세요.</p></div>'}
function exportSave(){let a=document.createElement("a"),blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});a.href=URL.createObjectURL(blob);a.download="basketball-manager-save.json";a.click();URL.revokeObjectURL(a.href)}
function importSave(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.clubs||!x.schedule)throw 0;state=x;persist();render()}catch(e){alert("올바른 세이브 파일이 아닙니다.")}};r.readAsText(f)}
function power(t){let p=t.players.slice(0,8);return p.reduce((s,x)=>s+x.ovr*.65+x.condition*.04-x.fatigue*.08,0)/p.length}
function playNext(){let g=nextGame();if(!g)return;let home=club(g.home),away=club(g.away);let homeP=power(home)+(home.id===state.teamId?2:0),awayP=power(away);let homeScore=0,awayScore=0,logs=[],stats={};for(let q=1;q<=4;q++){for(let n=0;n<40;n++){let attackHome=Math.random()<.5;let atk=attackHome?home:away,def=attackHome?away:home;let atkP=attackHome?homeP:awayP,defP=attackHome?awayP:homeP;let scorer=pick(atk.players.slice(0,8)),defender=pick(def.players.slice(0,8));let shot=atkP-defP+(Math.random()*14-7)+(scorer.attrs.decisions-10)*.25+(scorer.attrs.composure-10)*.2;let isThree=Math.random()<Math.min(.48,Math.max(.22,(scorer.attrs.three/20)*.48));let hit=Math.random()<Math.min(.78,Math.max(.25,.48+shot*.018+(isThree?(scorer.attrs.three-10)*.009:(scorer.attrs.mid-10)*.009)));let pts=hit?(isThree?3:2):0;if(attackHome)homeScore+=pts;else awayScore+=pts;let key=scorer.id;stats[key]??={pts:0,reb:0,ast:0};stats[key].pts+=pts;if(hit)logs.push(q+'Q · '+scorer.name+' 득점 성공 ('+pts+'점)');else logs.push(q+'Q · '+defender.name+' 수비 성공, '+scorer.name+' 슛 실패');if(n%4===0){let rebounder=pick(def.players.slice(0,8));let rk=rebounder.id;stats[rk]??={pts:0,reb:0,ast:0};stats[rk].reb++;if(Math.random()<.5){let passer=pick(atk.players.slice(0,8));let pk=passer.id;stats[pk]??={pts:0,reb:0,ast:0};stats[pk].ast++}}}}if(homeScore===awayScore){homeScore+=2;awayScore++}g.played=true;g.hs=homeScore;g.as=awayScore;g.logs=logs;home.pf+=homeScore;home.pa+=awayScore;away.pf+=awayScore;away.pa+=homeScore;if(homeScore>awayScore){home.w++;away.l++}else{away.w++;home.l++}for(let c of [home,away])c.players.forEach(p=>{let s=stats[p.id]||{pts:0,reb:0,ast:0};p.pts+=s.pts;p.reb+=s.reb;p.ast+=s.ast;p.minutes+=p.role==="선발"?27:12;p.fatigue=Math.min(100,p.fatigue+rnd(6,15));p.condition=Math.max(45,p.condition-rnd(1,5))});state.gameCount++;state.round=g.round;state.log.unshift({text:teamName(g.home)+" "+homeScore+" - "+awayScore+" "+teamName(g.away),round:g.round});persist();showGame(g.id)}
function showGame(id){let g=state.schedule.find(x=>x.id===id);let main=document.getElementById("main");main.innerHTML=head("GAME CENTER","경기 결과","ROUND "+g.round+" · 최종 경기 기록",'<button class="btn ghost" onclick="nav(\'schedule\')">일정으로</button>')+'<div class="matchbox"><div><div class="club">'+teamName(g.home)+'</div><div class="small muted">HOME</div></div><div><div class="score">'+g.hs+' : '+g.as+'</div><span class="pill good">FINAL</span></div><div><div class="club">'+teamName(g.away)+'</div><div class="small muted">AWAY</div></div></div><div class="section" style="display:grid;grid-template-columns:1.3fr 1fr;gap:12px"><div class="card"><h3>PLAY-BY-PLAY</h3><div class="log">'+g.logs.map(x=>'<p>'+x+'</p>').join("")+'</div></div><div class="card"><h3>COACHING REPORT</h3><p class="small muted" style="line-height:1.8">경기 엔진은 선수의 포지션별 능력치, 팀 전력, 컨디션과 전술을 반영해 공격 성공률을 계산합니다. 다음 단계에서 선수별 출전 시간·파울·스틸·블록·상세 박스스코어와 실시간 교체 컨트롤을 확장합니다.</p><button class="btn primary" onclick="nav(\'home\')">대시보드</button></div></div>'}
if(state?.clubs){document.getElementById("sidebar").classList.remove("hidden");render()}else renderSetup();
</script></body></html>
