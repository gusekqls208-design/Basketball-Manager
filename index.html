/* Full-screen broadcast mode */
body.broadcast-mode header,body.broadcast-mode .side{display:none!important}body.broadcast-mode .layout{display:block}body.broadcast-mode main{height:100dvh;padding:8px 16px 8px;overflow:hidden}
.live-broadcast{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,.75fr);gap:12px;max-width:1500px;margin:0 auto}
.broadcast-score{background:linear-gradient(100deg,#101820,#172431,#101820);border:1px solid #405267;color:#fff;border-radius:10px 10px 0 0;padding:12px 18px}
.broadcast-team{font-size:14px;letter-spacing:.7px}.broadcast-points{font-size:36px;font-family:Arial,sans-serif;font-weight:950;letter-spacing:2px}.broadcast-clock{color:#ffcf67;font-size:12px}
.live-court{aspect-ratio:16/9;background:repeating-linear-gradient(90deg,#bd8558 0,#bd8558 8%,#c58d60 8%,#c58d60 16%);border:6px solid #e6c59e;box-shadow:inset 0 0 0 2px #f7e5c9}
.court-token{display:none}
.court-athlete{position:absolute;width:clamp(38px,4.5vw,54px);height:72px;z-index:3;transition:left 1.65s cubic-bezier(.22,.61,.36,1),top 1.65s cubic-bezier(.22,.61,.36,1);transform:translate(-50%,-50%);text-align:center}
.athlete-name{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#101820eF;border:1px solid #ffffff66;border-radius:4px;padding:2px 5px;font-size:9px;font-weight:850;color:#fff;text-shadow:0 1px 2px #000}
.athlete-head{width:13px;height:13px;border-radius:50%;background:#d9a47d;border:1px solid #523b2c;margin:0 auto -1px}
.athlete-body{position:relative;width:25px;height:29px;margin:auto;border-radius:7px 7px 4px 4px;background:#e7e9ef;border:2px solid #f8f8f8;box-shadow:0 2px 4px #0008}
.court-athlete.away .athlete-body{background:#244b78;border-color:#c4e0ff}
.athlete-body:before,.athlete-body:after{content:"";position:absolute;top:5px;width:5px;height:23px;border-radius:5px;background:#d9a47d}
.athlete-body:before{left:-7px;transform:rotate(18deg)}.athlete-body:after{right:-7px;transform:rotate(-18deg)}
.athlete-legs{display:flex;justify-content:center;gap:4px}.athlete-legs i{display:block;width:6px;height:17px;background:#252525;border-radius:3px;transform-origin:top;animation:runlegs .34s infinite alternate}
.court-athlete:nth-of-type(even) .athlete-legs i{animation-delay:.17s}
@keyframes runlegs{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
.court-athlete.dribble .athlete-body{animation:dribble .45s infinite alternate}@keyframes dribble{to{transform:translateY(-3px)}}
.court-ball{width:12px;height:12px;transition:left 1.2s ease,top 1.2s ease;box-shadow:0 0 7px #ffcf67}
.broadcast-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:#111a23;border:1px solid #405267;border-top:0;padding:9px 11px}
.broadcast-controls select,.broadcast-controls button{font-size:10px;padding:7px 9px}
.broadcast-controls label{font-size:10px;color:#c7d1da;display:flex;align-items:center;gap:6px}
.broadcast-log{background:#101820;border-color:#33495e;max-height:480px}
.broadcast-log p{color:#b9c7d4;border-color:#273846;font-size:12px;padding:10px}
.broadcast-log p.active{background:#1e3245;border-left:3px solid #ffcf67;color:white}

function parseEspnStatCategory(data){

  const out={};
  labels.forEach((label,i)=>{const key=String(label||"").toUpperCase().replace(/[^A-Z0-9%]/g,"");const raw=String(vals[i]??"").replace(/,/g,"").trim();const value=Number(raw);if(key&&raw!==""&&Number.isFinite(value))out[key]=value;});

  return{out,score};
 }).filter(x=>Object.keys(x.out).length);
 candidates.sort((a,b)=>b.score-a.score);
 return candidates[0]?.out||{};
}

function updateHiddenEvidence(p,rows){
 const all=(rows||[]).filter(x=>Number(x.gp)>0);
 const completed=all.filter(x=>!/^2026-27$/.test(String(x.season||"")));
 if(!completed.length)return;
 p.hidden=p.hidden||{};
 p.hiddenEvidence=p.hiddenEvidence||{};
 const seasonGames=row=>{
  const end=Number(String(row.season||"").slice(5,9));
  return end===1999?50:end===2012?66:end===2020?72:end===2021?72:82;
 };
 // Injury frequency is based on completed-season games played; maximum rating is 15.
 const recent=completed.slice(0,Math.min(10,completed.length));
 const totals=recent.reduce((a,r)=>{a.gp+=Math.min(seasonGames(r),Number(r.gp)||0);a.expected+=seasonGames(r);return a;},{gp:0,expected:0});
 const availability=totals.expected?totals.gp/totals.expected:0;
 const injuryRaw=availability>=.97?2:availability>=.93?3:availability>=.88?4:availability>=.83?5:availability>=.78?6:availability>=.73?7:availability>=.68?8:availability>=.63?9:availability>=.58?10:availability>=.53?11:availability>=.48?12:availability>=.40?13:availability>=.30?14:15;
 const sampleFactor=Math.min(1,recent.length/5);
 p.hidden.injuryProneness=Math.max(1,Math.min(15,Math.round(10+(injuryRaw-10)*sampleFactor)));
 p.hiddenEvidence.injuryProneness="ESPN completed-season GP vs expected games; 1-15 scale";
 if(completed.length>=3){
  const avg=completed.map(r=>Number(r.pts)||0),mean=avg.reduce((a,b)=>a+b,0)/avg.length;
  const cv=mean>0?Math.sqrt(avg.reduce((a,b)=>a+(b-mean)**2,0)/avg.length)/mean:0;
  const gpRates=completed.map(r=>(Number(r.gp)||0)/seasonGames(r));
  const gpMean=gpRates.reduce((a,b)=>a+b,0)/gpRates.length;
  const gpVar=Math.sqrt(gpRates.reduce((a,b)=>a+(b-gpMean)**2,0)/gpRates.length);
  p.hidden.consistency=clampRating(17-Math.min(9,cv*10)-Math.min(5,gpVar*12)+Math.max(0,gpMean-.85)*8);
  p.hiddenEvidence.consistency="multi-season PPG variation + annual games-played rate";
 }
 const playoffRows=completed.filter(r=>Number(r.playoffs?.gp)>0);
 const playoffGames=playoffRows.reduce((n,r)=>n+Number(r.playoffs.gp||0),0);
 if(playoffGames>=8){
  const regPts=completed.reduce((n,r)=>n+(Number(r.pts)||0)*(Number(r.gp)||0),0)/Math.max(1,completed.reduce((n,r)=>n+(Number(r.gp)||0),0));
  const poPts=playoffRows.reduce((n,r)=>n+(Number(r.playoffs.pts)||0)*(Number(r.playoffs.gp)||0),0)/playoffGames;
  const uplift=regPts>0?(poPts-regPts)/regPts:0;
  const ovr=Number(p.ovr)||70;
  const starBase=ovr>=95?17:ovr>=90?16:ovr>=85?14:ovr>=80?12:10;
  const playoffExperience=playoffGames>=150?2:playoffGames>=75?1:0;
  const playoffPerformance=Math.max(-2,Math.min(2,uplift*8));
  p.hidden.importantMatches=clampRating(starBase+playoffExperience+playoffPerformance);
  p.hiddenEvidence.importantMatches="NBA 2K OVR star tier + ESPN playoff experience + postseason scoring change";
 }
 p.hidden.injuryProneness=Math.max(1,Math.min(15,Number(p.hidden.injuryProneness)||10));
 p.hiddenSource="ESPN 커리어 기록 기반 산정 · 표본 부족 항목은 중립값";
}
function parseEspnGameLogTotals(data,gp){
 try{
  const types=Array.isArray(data?.seasonTypes)?data.seasonTypes:[];
  const regular=types.find(x=>/regular/i.test(String(x.displayName||x.name||""))||String(x.id||x.type?.id||"")==="2")||types[0];
  const categories=regular?.categories||data?.categories||[];
  let chosen=null;
  for(const cat of categories){
   const ev=cat?.events;
   const arr=Array.isArray(ev)?ev:(ev&&typeof ev==="object"?Object.values(ev):[]);
   if(arr.length){chosen={cat,arr};break;}
  }
  if(!chosen)return null;
  const labels=chosen.cat.labels||data.labels||data.displayNames||[];
  const idx={};labels.forEach((x,i)=>{const k=String(x||"").toUpperCase().replace(/[^A-Z0-9]/g,"");idx[k]=i;});
  const keys={min:["MIN","MINUTES"],pts:["PTS","POINTS"],reb:["REB","REBOUNDS"],ast:["AST","ASSISTS"],stl:["STL","STEALS"],blk:["BLK","BLOCKS"],to:["TO","TOV","TURNOVERS"]};
  const sums={min:0,pts:0,reb:0,ast:0,stl:0,blk:0,to:0};let counted=0;
  for(const ev of chosen.arr){
   const vals=ev?.stats||ev?.values||[];if(!Array.isArray(vals)||!vals.length)continue;
   const read=k=>{const i=keys[k].map(x=>idx[x]).find(x=>x!==undefined);if(i===undefined)return null;const raw=String(vals[i]??"").trim();if(!raw||raw==="--"||raw==="DNP")return null;if(k==="min"&&raw.includes(":")){const z=raw.split(":").map(Number);return z[0]+(z[1]||0)/60;}const n=Number(raw.replace(/,/g,""));return Number.isFinite(n)?n:null;};
   const row={};for(const k of Object.keys(keys))row[k]=read(k);
   if(Object.keys(row).some(k=>k!=="min"&&row[k]!==null)){counted++;for(const k of Object.keys(keys))if(row[k]!==null)sums[k]+=row[k];}
  }
  if(counted<Math.max(1,Math.floor(Number(gp||0)*.9)))return null;
  return{...sums,gameLogGames:counted};
 }catch(e){return null}
}

 const num=(v)=>v===""||v==null?null:Number(v);
 const all=state.clubs.flatMap(t=>t.players.map(p=>({...p,from:t.id,team:t.name}))).filter(p=>p.from!==state.teamId).filter(p=>{
  if(q&&!String(p.name||"").toLocaleLowerCase().includes(q))return false;

  if(f.heightMin!=null&&f.heightMin!==""&&(h===null||h<num(f.heightMin)))return false;

  if(f.nation){const nation=String(p.nationality||p.country||p.citizenship||p.birthCountry||"").toLocaleLowerCase();if(!nation.includes(f.nation))return false;}
  if(f.attr&&f.attrMin!==""&&f.attrMin!=null){const rawAttr=p.attrs?.[f.attr];const attrValue=rawAttr==null||rawAttr===""?NaN:Number(rawAttr);const minAttr=Number(f.attrMin);if(!Number.isFinite(attrValue)||!Number.isFinite(minAttr)||attrValue<minAttr)return false;}
  return true;
 });
 const order={PG:0,SG:1,SF:2,PF:3,C:4};
 all.sort((a,b)=>{let x=marketSortKey==="team"?a.team:a[marketSortKey],y=marketSortKey==="team"?b.team:b[marketSortKey];if(marketSortKey==="name"){x=(x||"").toLocaleLowerCase();y=(y||"").toLocaleLowerCase()}if(marketSortKey==="pos"){x=order[x]??99;y=order[y]??99}if(typeof x==="string")return x.localeCompare(y,"ko")*marketSortDir;return ((+x||0)-(+y||0))*marketSortDir});
 const summary=document.getElementById("marketFilterSummary");if(summary){const active=Object.values(f).some(v=>v!==""&&v!=null);summary.textContent=(active?"상세 조건 적용 중 · ":"")+"검색 결과 "+all.length+"명";}

function power(t){let p=t.players.slice(0,8);let base=p.reduce((s,x)=>s+x.ovr*.13+x.condition*.04-x.fatigue*.08,0)/p.length;let fit=0;if(t.tactics){fit+=t.tactics.off==="3점슛 중심"?p.reduce((s,x)=>s+x.attrs.three*.018,0)/p.length:t.tactics.off==="픽앤롤 중심"?p.reduce((s,x)=>s+(x.attrs.handle+x.attrs.pass+x.attrs.screen)/60*.018,0)/p.length:0;fit+=t.tactics.def==="맨투맨"?p.reduce((s,x)=>s+x.attrs.perimeter*.012,0)/p.length:t.tactics.def.includes("지역")?p.reduce((s,x)=>s+(x.attrs.interior+x.attrs.rebound)/40*.012,0)/p.length:0;if(t.tactics.tempo==="빠르게")fit+=p.reduce((s,x)=>s+(x.attrs.speed+x.attrs.stamina)/40*.04,0)/p.length;if(t.tactics.tempo==="느리게")fit+=p.reduce((s,x)=>s+x.attrs.decisions*.035,0)/p.length;}return base+fit}

function simDistributeMinutes(line){
 const active=line.rotation||[],mins={};if(!active.length)return mins;
 const starters=line.starters||[],starterIds=new Set(starters.map(p=>p.id));
 const values=active.map((p,i)=>{
  const starter=starterIds.has(p.id);
  const condition=simClamp((Number(p.condition)||75)/85,.65,1.12);
  const fatigue=simClamp(1-(Number(p.fatigue)||0)/170,.55,1);
  const quality=simClamp((Number(p.ovr)||50)/72,.72,1.22);
  const roleBoost=["프랜차이즈 스타","핵심 선수"].includes(p.role)?1.12:p.role==="선발"?1.04:p.role==="전력 외"?.78:1;
  const weight=quality*condition*fatigue*roleBoost*(.88+Math.random()*.24);
  return {p,starter,weight,min:starter?27+Math.floor(Math.random()*5):8+Math.floor(Math.random()*6)};
 });
 let total=values.reduce((a,x)=>a+x.min,0);
 while(total<240){
  const eligible=values.filter(x=>x.min<(x.starter?38:26));
  if(!eligible.length)break;
  const sum=eligible.reduce((a,x)=>a+x.weight,0);let r=Math.random()*sum;
  let chosen=eligible[eligible.length-1];
  for(const x of eligible){r-=x.weight;if(r<=0){chosen=x;break}}
  chosen.min++;total++;
 }
 while(total>240){
  const eligible=values.filter(x=>x.min>(x.starter?24:5));
  if(!eligible.length)break;
  eligible.sort((a,b)=>(a.weight/(a.min+1))-(b.weight/(b.min+1)));
  eligible[0].min--;total--;
 }
 values.forEach(x=>mins[x.p.id]=x.min);
 return mins;
}

function bmBestFive(team){

function bmAutoSubQuarter(m,user){

function bmReconcilePoints(box,team,target){

}

function bmReconcilePoints(box,team,target){

}

function bmQuarterActiveFive(team,starters,bench,segment){
 const all=[...starters.map(id=>team.players.find(p=>String(p.id)===String(id))).filter(Boolean),...bench.map(id=>team.players.find(p=>String(p.id)===String(id))).filter(Boolean)];
 const picked=starters.map(id=>team.players.find(p=>String(p.id)===String(id))).filter(Boolean);
 const replacements=Math.min(4,Math.floor(segment/2));
 const benchRank=bench.map(id=>team.players.find(p=>String(p.id)===String(id))).filter(Boolean).sort((a,b)=>bmPlayerQuality(b)-bmPlayerQuality(a));
 for(let n=0;n<replacements&&benchRank.length;n++){
  const incoming=benchRank[n],outgoing=picked.slice().sort((a,b)=>(simAttr(a,"stamina")-simAttr(b,"stamina"))||(bmPlayerQuality(a)-bmPlayerQuality(b)))[0];
  if(outgoing&&incoming){picked[picked.indexOf(outgoing)]=incoming}
 }
 const seen=new Set();return picked.filter(p=>{if(seen.has(String(p.id)))return false;seen.add(String(p.id));return true}).slice(0,5);
}
function bmPickShooter(line,box,style){

  let w=Math.max(1,bmPlayerQuality(p)*.32+simAttr(p,"close")+simAttr(p,"layup")+simAttr(p,"three")+simAttr(p,"handle"));
  if(style==="포스트업"||style==="포스트업 중심")w*=["PF","C"].includes(p.pos)?1.65:["PG","SG"].includes(p.pos)?.72:1;
  if(p.gameInstruction==="패스 우선")w*=.62;
  if(p.gameInstruction==="외곽슛 우선")w*=1.12;

 });
}

function finishQuarterGame(){

 g.played=true;g.hs=m.homeScore;g.as=m.awayScore;g.boxscore={home:m.homeBox,away:m.awayBox,homeLine:m.homeLine,awayLine:m.awayLine,quarters:m.quarters,version:3,engine:"possession-by-possession"};
 home.pf+=g.hs;home.pa+=g.as;away.pf+=g.as;away.pa+=g.hs;
 if(g.hs>g.as){home.w++;away.l++}else{away.w++;home.l++}
 for(const team of [home,away]){
  const box=team===home?m.homeBox:m.awayBox;
  for(const p of team.players){
   const st=box[p.id]||simMakeStats(p);p.pts=(Number(p.pts)||0)+st.pts;p.reb=(Number(p.reb)||0)+st.reb;p.ast=(Number(p.ast)||0)+st.ast;
   p.seasonStats=p.seasonStats||{gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,tov:0};
   if(!st.dnp&&st.min>0){p.seasonStats.gp++;for(const k of ["pts","reb","ast","stl","blk","tov"])p.seasonStats[k]=(p.seasonStats[k]||0)+(st[k]||0);p.minutes=(Number(p.minutes)||0)+st.min}
   else{p.fatigue=Math.max(0,(Number(p.fatigue)||0)-2);p.condition=simClamp((Number(p.condition)||75)+1,40,100)}
  }
 }
 state.gameCount=(state.gameCount||0)+1;state.round=g.round;state.log.unshift({text:teamName(g.home)+" "+g.hs+" - "+g.as+" "+teamName(g.away),round:g.round});

 delete state.gameInProgress;delete state.matchSetup;persist();showGame(g.id);
}

function bmCoachAdvice(q,home,away,userHome){

function bmSortCoachRoster(key){window.bmRosterSortKey=key;bmCoachBoard(window.bmCoachMode||"pre");}
function bmCoachRating(p,box){
 const x=box?.[p.id]||{},min=Number(x.min)||0;
 if(!min)return "—";
 const fg=Number(x.fgm)||0,fga=Number(x.fga)||0,threeM=Number(x.threeM)||0,threeA=Number(x.threeA)||0;
 let v=6.0+(Number(x.pts)||0)*.105+(Number(x.reb)||0)*.16+(Number(x.ast)||0)*.20+(Number(x.stl)||0)*.34+(Number(x.blk)||0)*.32-(Number(x.tov)||0)*.25;
 if(fga)v+=(fg/fga-.43)*2.2;
 if(threeA)v+=(threeM/threeA-.34)*.55;
 return Math.max(4,Math.min(10,Math.round(v*10)/10)).toFixed(1);
}
function bmAutoLineup(){
 const pre=window.bmCoachMode==="pre",c=pre?state.matchSetup:state.gameInProgress,t=club(state.teamId);if(!c||!t)return;
 const mins=pre?{}:(c.liveQuarter?.minutes?.[c.userIsHome?"home":"away"]||{}),energy=p=>Math.max(0,100-(Number(p.fatigue)||0)-(Number(mins[p.id])||0)),injured=p=>!!(p.injured||p.injury||Number(p.injuryWeeks)>0),quality=p=>Number(bmPlayerQuality(p))||Number(p.ovr)||50;
 const proficiency=(p,pos)=>{for(const k of ["positionSkills","positionRatings","posRatings","positionProficiency"]){const v=p[k];if(v&&Number.isFinite(Number(v[pos])))return Number(v[pos]);}if(p.pos===pos)return 100;if((p.secondaryPositions||[]).includes(pos))return 84;if((p.positions||[]).includes(pos))return 78;return 55;};
 const score=(p,pos)=>{const skill=proficiency(p,pos),fit=p.pos===pos?24:(p.secondaryPositions||[]).includes(pos)?15:skill>=70?10:skill>=60?3:-13,st=energy(p),tired=st<18?-24:st<30?-12:st<45?-5:0;return quality(p)*.42+st*.30+fit+(skill-70)*.18+tired+(injured(p)?-42:0);};
 const pool=[...t.players],picked=[];
 ["PG","SG","SF","PF","C"].forEach(pos=>{const cand=pool.filter(p=>!picked.includes(p)).sort((x,y)=>score(y,pos)-score(x,pos));if(cand[0])picked.push(cand[0]);});
 const ids=picked.map(p=>p.id),remaining=pool.filter(p=>!ids.some(id=>String(id)===String(p.id)));
 remaining.sort((x,y)=>(quality(y)*.55+energy(y)*.35+(injured(y)?-40:0))-(quality(x)*.55+energy(x)*.35+(injured(x)?-40:0)));
 const bench=remaining.slice(0,8).map(p=>p.id);
 if(pre){c.starters=ids;c.bench=bench;c.excluded=remaining.slice(8).map(p=>p.id);c.instructions=c.instructions||{}}
 else{c.userStarters=ids;c.userBench=bench;c.userExcluded=remaining.slice(8).map(p=>p.id);c.userInstructions=c.userInstructions||{}}
 persist();bmCoachBoard(pre?"pre":"quarter");
}
function bmCoachPointerDown(e,id){
 if(e.button!==undefined&&e.button!==0)return;
 const card=e.currentTarget,startX=e.clientX,startY=e.clientY;
 window.bmDragV2={id,x:startX,y:startY,src:card,dragging:false,scrolling:false};
 window.bmLastDragId=id;
 const move=ev=>{
  const d=window.bmDragV2;if(!d)return;
  const dx=ev.clientX-d.x,dy=ev.clientY-d.y;
  if(!d.dragging&&!d.scrolling&&Math.hypot(dx,dy)>9){
   if(Math.abs(dy)>Math.abs(dx)*1.15){d.scrolling=true;return}
   if(Math.abs(dx)>9){d.dragging=true;d.ghost=d.src.cloneNode(true);d.ghost.classList.add("fm-drag-ghost");d.src.classList.add("is-dragging");document.body.appendChild(d.ghost)}
  }
  if(d.dragging&&d.ghost){
   d.ghost.style.left=ev.clientX+"px";d.ghost.style.top=ev.clientY+"px";
   document.querySelectorAll(".fm-slot,.fm-excluded-drop").forEach(x=>x.classList.remove("drop-ready"));
   document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".fm-slot,.fm-excluded-drop")?.classList.add("drop-ready");
  }
 };
 const finish=ev=>{
  const d=window.bmDragV2;if(!d)return;
  document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",finish);document.removeEventListener("pointercancel",cancel);
  d.src.classList.remove("is-dragging");d.ghost?.remove();
  document.querySelectorAll(".fm-slot,.fm-excluded-drop").forEach(x=>x.classList.remove("drop-ready"));
  if(d.dragging){
   const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".fm-slot,.fm-excluded-drop");
   if(target?.classList.contains("fm-slot"))bmCoachAssign(d.id,+target.dataset.slot);
   else if(target?.classList.contains("fm-excluded-drop"))bmDropExcluded(ev);
   else window.bmLastDragId=null;
  }else if(!d.scrolling){bmPickCoachPlayer(d.id)}
  window.bmDragV2=null;
 };
 const cancel=()=>{const d=window.bmDragV2;if(d){d.ghost?.remove();d.src.classList.remove("is-dragging")}window.bmDragV2=null;window.bmLastDragId=null};
 document.addEventListener("pointermove",move,{passive:true});document.addEventListener("pointerup",finish,{once:true});document.addEventListener("pointercancel",cancel,{once:true});
}
const bmCoachBoardBeforeRefine=bmCoachBoard;
bmCoachBoard=function(mode){
 if(mode==="emergency"){bmCoachBoardBeforeRefine(mode);return}
 bmCoachBoardBase(mode);
 const pre=mode==="pre",c=pre?state.matchSetup:state.gameInProgress,t=club(state.teamId);
 if(!c||!t)return;
 const ids=pre?c.starters:c.userStarters,box=pre?{}:(c.userIsHome?c.homeBox:c.awayBox)||{};

  const b=document.createElement("button");b.className="btn fm-auto-lineup";b.textContent="체력·능력치 기준 자동 선발";b.onclick=bmAutoLineup;actions.insertBefore(b,actions.firstChild);
 }
 document.querySelectorAll(".fm-pcard,.fm-roster-row").forEach(el=>{
  const p=t.players.find(x=>String(x.id)===String(el.dataset.pid));if(!p)return;
  const old=el.querySelector(".fm-player-health");
  if(old){const second=old.querySelectorAll(":scope > span")[1];if(second)second.remove()}
  const rating=bmCoachRating(p,box);

  if(!r){r=document.createElement("span");r.className="fm-live-rating";el.appendChild(r)}
  r.textContent=rating==="—"?"평점 —":"평점 "+rating;
  if(ids.some(id=>String(id)===String(p.id)))r.classList.add("is-starter");
 });
};
