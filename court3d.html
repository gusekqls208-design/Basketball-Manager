<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D COURT · Basketball Manager</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d16;color:#fff;font-family:Arial,sans-serif}canvas{display:block}.hud{position:absolute;inset:0;pointer-events:none}.score{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;background:#101722;border:1px solid #46566b;box-shadow:0 8px 30px #0009;border-radius:4px;overflow:hidden;min-width:430px}.team{padding:10px 18px;min-width:150px;background:#18283b;font-weight:800}.team.away{background:#28313d}.num{font-size:30px;color:#ff3c45;font-weight:900;float:right;margin-left:15px;font-variant-numeric:tabular-nums}.mid{padding:8px 15px;text-align:center;background:#090f18;min-width:112px}.clock{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums}.shot{font-size:12px;color:#ff626a}.status{position:absolute;top:88px;left:50%;transform:translateX(-50%);background:#101722dd;padding:7px 16px;border-radius:3px;color:#dce6f3;font-size:13px}.panel{position:absolute;bottom:16px;left:16px;width:min(380px,42vw);max-height:32vh;overflow:hidden;background:#101722e8;border:1px solid #40516a;border-radius:5px;padding:12px}.panel b{color:#ffb15d;font-size:11px;letter-spacing:1px}.feed{font-size:14px;line-height:1.5;margin-top:6px}.controls{position:absolute;bottom:16px;right:16px;pointer-events:auto;display:flex;gap:8px;align-items:center}.controls button,.controls select,.exit{background:#182536;color:white;border:1px solid #53657c;padding:10px 13px;border-radius:4px;font-weight:700}.exit{position:absolute;top:16px;left:16px;pointer-events:auto}.legend{position:absolute;right:18px;top:92px;background:#101722c9;padding:8px 12px;font-size:11px;color:#b8c5d6}.legend span{display:block;margin:3px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.end{position:absolute;inset:0;background:#07101ddd;display:none;place-items:center;text-align:center;pointer-events:auto}.end div{font-size:28px;font-weight:900}.end button{margin-top:20px;padding:12px 22px;background:#f28a2e;color:#111;border:0;border-radius:4px;font-weight:900}
</style></head><body><div class="hud"><button class="exit" onclick="leave()">← 경기 화면 나가기</button><div class="score"><div class="team" id="home">HOME <span class="num" id="hs">0</span></div><div class="mid"><div class="clock" id="clock">12:00</div><div id="period">1ST QUARTER</div><div class="shot" id="shot">24 SHOT CLOCK</div></div><div class="team away" id="away">AWAY <span class="num" id="as">0</span></div></div><div class="status" id="status">BUILD 4 · 3D COURT LOADING</div><div class="legend"><span><i style="background:#e5a24c"></i>HOME</span><span><i style="background:#63a9e8"></i>AWAY</span><span>3D COURTSIDE SIMULATION</span></div><div class="panel"><b>LIVE PLAY-BY-PLAY</b><div class="feed" id="feed">선수들이 코트로 들어섭니다.</div></div><div class="controls"><select id="speed" onchange="speed=+this.value"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select><button onclick="paused=!paused;this.textContent=paused?'▶ 재개':'Ⅱ 정지'">Ⅱ 정지</button></div><div class="end" id="end"><div><span>FINAL</span><p id="final"></p><button onclick="leave()">경기 결과 확인</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script><script>
const P=window.parent;
const demoHome={name:"HOME",players:Array.from({length:5},(_,i)=>({id:"demo-h"+i,name:["POINT GUARD","SHOOTING GUARD","SMALL FORWARD","POWER FORWARD","CENTER"][i]}))};
const demoAway={name:"AWAY",players:Array.from({length:5},(_,i)=>({id:"demo-a"+i,name:["GUARD A","GUARD B","WING","FORWARD","CENTER"][i]}))};
const isDemo=!P.liveMatch;
const M=P.liveMatch||{home:demoHome,away:demoAway,homeScore:0,awayScore:0,possHome:true,stats:Object.fromEntries([...demoHome.players,...demoAway.players].map(p=>[p.id,{pts:0,reb:0,ast:0,fga:0,fgm:0,tpm:0}]))};
if(isDemo)document.getElementById("status").textContent="BUILD 4 · 3D 코트 미리보기 · DEMO";else document.getElementById("status").textContent="BUILD 4 · LIVE MATCH";

let scene,camera,renderer,clock3,players=[],ball,paused=false,speed=1,gameSec=720,shot=24,quarter=1,phase='setup',phaseT=0,possHome=M.possHome!==false,attacker=0,defender=0,scoreH=M.homeScore||0,scoreA=M.awayScore||0,done=false,feedTimer=0,elapsed=0;
const home=M.home,away=M.away;document.getElementById('home').innerHTML=home.name+' <span class="num" id="hs">0</span>';document.getElementById('away').innerHTML=away.name+' <span class="num" id="as">0</span>';
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x0a101b);scene.fog=new THREE.Fog(0x0a101b,35,75);camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,150);camera.position.set(0,27,35);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdceaff,0x44301f,2));let light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(-10,25,12);light.castShadow=true;scene.add(light);
const floor=new THREE.Mesh(new THREE.BoxGeometry(18,.5,30),new THREE.MeshStandardMaterial({color:0xb9824b,roughness:.72}));floor.position.y=-.3;floor.receiveShadow=true;scene.add(floor);
const lineMat=new THREE.MeshBasicMaterial({color:0xf5dfbd});function line(x1,z1,x2,z2){let d=new THREE.Vector3(x2-x1,0,z2-z1),o=new THREE.Mesh(new THREE.BoxGeometry(.055,.02,d.length()),lineMat);o.position.set((x1+x2)/2,-.03,(z1+z2)/2);o.rotation.y=Math.atan2(d.x,d.z);scene.add(o)}
line(-8.7,-14,8.7,-14);line(-8.7,14,8.7,14);line(-8.7,-14,-8.7,14);line(8.7,-14,8.7,14);line(-8.7,0,8.7,0);
let circle=new THREE.Mesh(new THREE.TorusGeometry(1.8,.035,8,64),lineMat);circle.rotation.x=Math.PI/2;circle.position.y=.02;scene.add(circle);
for(let z of [-11.8,11.8]){let arc=new THREE.Mesh(new THREE.TorusGeometry(6.6,.035,8,64,Math.PI),lineMat);arc.rotation.x=Math.PI/2;arc.rotation.z=z>0?Math.PI:0;arc.position.set(0,.03,z);scene.add(arc);let board=new THREE.Mesh(new THREE.BoxGeometry(3,.12,.2),new THREE.MeshStandardMaterial({color:0xe5e8ec}));board.position.set(0,3.8,z>0?14.8:-14.8);scene.add(board);let rim=new THREE.Mesh(new THREE.TorusGeometry(.45,.06,8,32),new THREE.MeshStandardMaterial({color:0xff6a28}));rim.rotation.x=Math.PI/2;rim.position.set(0,3.1,z>0?13.8:-13.8);scene.add(rim)}
function makePlayer(team,index,side){let group=new THREE.Group(),color=side?0x63a9e8:0xe5a24c,skin=0x9b6848,jersey=new THREE.MeshStandardMaterial({color,roughness:.65}),skinmat=new THREE.MeshStandardMaterial({color:skin}),shortmat=new THREE.MeshStandardMaterial({color:side?0x315e8a:0x87512b});function capsule(r,h,mat,x,y,z){let m=new THREE.Mesh(new THREE.CapsuleGeometry(r,h,4,8),mat);m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}
let torso=capsule(.32,.68,jersey,0,1.45,0),head=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),skinmat);head.position.y=2.05;head.castShadow=true;group.add(head);let shorts=new THREE.Mesh(new THREE.BoxGeometry(.55,.35,.35),shortmat);shorts.position.y=.9;group.add(shorts);let limbs=[];for(let x of [-.16,.16]){let arm=capsule(.095,.48,skinmat,x,1.45,0);let leg=capsule(.11,.56,skinmat,x,.48,0);limbs.push({arm,leg,base:x})}let label=document.createElement('div');label.style.cssText='position:absolute;color:white;font:700 11px Arial;text-shadow:0 2px 4px #000;white-space:nowrap';document.body.appendChild(label);return {group,limbs,team,index,label,side,base:team.players[index],target:new THREE.Vector3(),from:new THREE.Vector3(),name:team.players[index]?.name||'PLAYER',phase:'idle'} }
for(let side=0;side<2;side++){let t=side?away:home;for(let i=0;i<5;i++){let p=makePlayer(t,i,side);scene.add(p.group);players.push(p)}}ball=new THREE.Mesh(new THREE.SphereGeometry(.19,16,12),new THREE.MeshStandardMaterial({color:0xd66a27,roughness:.8}));ball.castShadow=true;scene.add(ball);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});clock3=new THREE.Clock();startPossession();animate()}
function setFeed(s){document.getElementById('feed').textContent=s;document.getElementById('status').textContent=s}
function setTarget(p,x,z,act){p.target.set(x,0,z);p.phase=act||'run'}
function startPossession(){if(done)return;phase='advance';phaseT=0;shot=24;attacker=Math.floor(Math.random()*5);defender=attacker;let sign=possHome?1:-1;players.forEach((p,i)=>{let slot=i%5,off=p.side===0?possHome:!possHome;let x=off?[-5,-2.5,0,2.5,5][slot]:[-4,-2,0,2,4][slot],z=off?(sign===1?-7:7):(sign===1?2:-2);setTarget(p,x,z,off?'run':'defend')});setFeed((possHome?home.name:away.name)+' 볼 소유. 하프코트를 넘어 공격을 전개합니다.')}
function beginAction(){phase='set';phaseT=0;let offense=players.filter(p=>p.side===(possHome?0:1)),defense=players.filter(p=>p.side!==(possHome?0:1)),sign=possHome?1:-1;let ballHandler=offense[attacker];offense.forEach((p,i)=>{if(i===attacker)setTarget(p,0,sign*2,'dribble');else setTarget(p,[-5,-3,3,5][i%4],sign*(i===1?5:8),'cut')});defense.forEach((p,i)=>setTarget(p,[-4,-2,2,4,0][i],sign*(i===4?1: i===attacker?3:5),'defend'));setFeed(ballHandler.name+'이(가) 볼을 잡고 공격을 조율합니다. 수비가 매치업을 맞춥니다.')}
function attemptShot(){phase='shot';phaseT=0;let offense=players.filter(p=>p.side===(possHome?0:1)),shooter=offense[attacker],sign=possHome?1:-1;setTarget(shooter,0,sign*10,'shoot');setFeed(shooter.name+' 슛 동작! 수비수가 컨테스트에 들어갑니다.')}
function rebound(){phase='rebound';phaseT=0;let sign=possHome?1:-1;players.forEach((p,i)=>setTarget(p,(i%5-2)*1.4,sign*10+(i%2),i%2?'boxout':'rebound'));setFeed('슛이 림을 맞고 나옵니다! 양 팀이 리바운드 경합을 벌입니다.')}
function resolveShot(){let offense=players.filter(p=>p.side===(possHome?0:1)),shooter=offense[attacker],def=players.filter(p=>p.side!==(possHome?0:1))[defender],three=Math.random()<.28,success=Math.random()<(three?.34:.49),pts=three?3:2;shooter.base&&((M.stats[shooter.base.id]||{}).fga=(M.stats[shooter.base.id]?.fga||0)+1);if(success){if(possHome)scoreH+=pts;else scoreA+=pts;if(M.stats[shooter.base.id]){M.stats[shooter.base.id].pts+=pts;M.stats[shooter.base.id].fgm=(M.stats[shooter.base.id].fgm||0)+1}if(three&&M.stats[shooter.base.id])M.stats[shooter.base.id].tpm=(M.stats[shooter.base.id].tpm||0)+1;setFeed(shooter.name+' 슛 성공! '+pts+'점입니다.');document.getElementById('hs').textContent=scoreH;document.getElementById('as').textContent=scoreA;M.homeScore=scoreH;M.awayScore=scoreA}else{setFeed(shooter.name+'의 슛이 빗나갑니다. 리바운드 경합!');}phase=success?'made':'miss';phaseT=0}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock3.getDelta(),.05)*speed;if(!paused&&!done){elapsed+=dt;phaseT+=dt;feedTimer+=dt;let gameTick=dt;gameSec-=gameTick;shot-=gameTick;M.clock=gameSec;M.shotClock=shot;if(gameSec<=0){if(quarter<4){quarter++;gameSec=720;startPossession()}else endGame()}if(shot<=0&&phase!=='shot'&&phase!=='made'&&phase!=='miss'&&phase!=='rebound'){attemptShot()}
if(phase==='advance'&&phaseT>2.4)beginAction();else if(phase==='set'&&phaseT>3.3){if(Math.random()<.58)attemptShot();else{let off=players.filter(p=>p.side===(possHome?0:1));attacker=(attacker+1)%5;setFeed(off[attacker].name+'에게 패스! 수비가 로테이션합니다.');phase='pass';phaseT=0;let rec=off[attacker];setTarget(rec,Math.random()*5-2.5,(possHome?1:-1)*4,'catch')}}else if(phase==='pass'&&phaseT>1.1)beginAction();else if(phase==='shot'&&phaseT>1.25)resolveShot();else if(phase==='made'&&phaseT>1.3){possHome=!possHome;startPossession()}else if(phase==='miss'&&phaseT>0.3)rebound();else if(phase==='rebound'&&phaseT>1.6){let off=players.filter(p=>p.side===(possHome?0:1));let got=Math.random()<.48;if(got&&M.stats[off[0].base.id])M.stats[off[0].base.id].reb++;if(!got)possHome=!possHome;startPossession()}}
players.forEach((p,i)=>{let pos=p.group.position,dx=p.target.x-pos.x,dz=p.target.z-pos.z,dist=Math.hypot(dx,dz),step=Math.min(1,dt*(p.phase==='defend'?2.5:2.1));pos.x+=dx*step;pos.z+=dz*step;p.group.rotation.y=Math.atan2(dx,dz);let moving=dist>.08,run=elapsed*10+(i%3);p.limbs.forEach((l,j)=>{l.leg.rotation.x=moving?Math.sin(run+j*Math.PI)*.65:0;l.arm.rotation.x=moving?Math.sin(run+j*Math.PI+Math.PI)*.35:0});if(p.phase==='shoot'){p.limbs[0].arm.rotation.x=-2.2;p.limbs[1].arm.rotation.x=-2.2}let v=p.group.position.clone();v.y+=2.5;v.project(camera);p.label.style.left=((v.x*.5+.5)*innerWidth-25)+'px';p.label.style.top=((-v.y*.5+.5)*innerHeight-8)+'px';p.label.textContent=p.name});
let handler=players.find(p=>p.side===(possHome?0:1)&&p.index===attacker);if(phase==='shot'){let t=Math.min(1,phaseT/1.25),z=(possHome?1:-1)*(10+3*t);ball.position.set(handler.group.position.x,1.7+Math.sin(t*Math.PI)*3,z);if(t>.7)ball.position.y=3.4+Math.sin((t-.7)/.3*Math.PI)*.3}else if(phase==='made'){ball.position.set(0,3.1,(possHome?1:-1)*13.8)}else{ball.position.set(handler.group.position.x+.35,1.15+Math.abs(Math.sin(elapsed*11))*.45,handler.group.position.z+.15);if(phase==='pass'){ball.position.lerp(handler.group.position.clone().add(new THREE.Vector3(0,1.5,0)),Math.min(1,phaseT))}}
document.getElementById('clock').textContent=Math.floor(gameSec/60)+':'+String(Math.floor(gameSec%60)).padStart(2,'0');document.getElementById('period').textContent=quarter+'TH QUARTER';document.getElementById('shot').textContent=Math.max(0,Math.ceil(shot))+' SHOT CLOCK';renderer.render(scene,camera)}
function endGame(){done=true;M.homeScore=scoreH;M.awayScore=scoreA;M.ended=false;document.getElementById('end').style.display='grid';document.getElementById('final').textContent=home.name+' '+scoreH+' - '+scoreA+' '+away.name;if(!isDemo){try{P.finishLiveMatch()}catch(e){}}}
function leave(){if(isDemo){location.href='index.html';return;}if(P&&P.document){P.document.body.classList.remove('broadcast-mode');P.nav('schedule')}}
try{init()}catch(e){document.getElementById("status").textContent="3D 초기화 오류: "+e.message;console.error(e)}
</script></body></html>
